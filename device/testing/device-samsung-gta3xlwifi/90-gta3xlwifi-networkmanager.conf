[device-gta3xlwifi-p2p]
match-device=interface-name:p2p0
managed=0

# WLBT firmware starts once per boot, when wlan0 is first opened, and stops
# for good when wlan0 is taken down. wlan0 stays unmanaged until
# wifibt-networkmanager has started the firmware and hands it over, and
# NetworkManager must not take it down afterwards to change its MAC address.
[device-gta3xlwifi-station]
match-device=interface-name:wlan0
managed=0
wifi.scan-rand-mac-address=no

[connection-gta3xlwifi-station]
match-device=interface-name:wlan0
wifi.cloned-mac-address=preserve
