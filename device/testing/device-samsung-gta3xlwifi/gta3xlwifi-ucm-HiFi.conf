# One ABOX playback stream that plays on either the TFA9896 speaker
# amplifiers or the COD3035X headphone codec ("Playback Output"). The kernel
# also follows the jack by itself; these devices let PulseAudio show and
# switch the two outputs. The built-in microphone records on PCM device 1.

SectionVerb {
	EnableSequence [
		# Vendor "recording-mic" gains: 12 dB boost, +2.5 dB ADC.
		cset "name='MIC1 Boost Volume' 1"
		cset "name='ADC Capture Volume' 131,131"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Playback Output' Speaker"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Playback Output' Headphone"
	]

	DisableSequence [
		cset "name='Playback Output' Speaker"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='ADCL Mixer MIC1 Switch' on"
		cset "name='ADCR Mixer MIC1 Switch' on"
	]

	DisableSequence [
		cset "name='ADCL Mixer MIC1 Switch' off"
		cset "name='ADCR Mixer MIC1 Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC"
	}
}
