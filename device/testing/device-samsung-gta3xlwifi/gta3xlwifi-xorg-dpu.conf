# Panfrost is render-only; scan out through the Exynos7885 DPU KMS device.
# TearFree needs the patched xorg-server (older servers ignore the option).
# Without it a rotated screen is scanned out from a buffer the server redraws
# in place, and every update tears.
Section "OutputClass"
	Identifier "Exynos7885 DPU"
	MatchDriver "exynos7885-dpu"
	Driver "modesetting"
	Option "PrimaryGPU" "true"
	Option "TearFree" "true"
EndSection
